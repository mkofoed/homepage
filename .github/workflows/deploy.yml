name: Deploy to VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SECRET_KEY: this-is-a-long-random-test-only-secret-key-for-django-checks
      SQL_USER: test_user
      SQL_PASSWORD: test_password
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.11.29"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install locked dependencies
      run: uv sync --locked --extra dev

    # djLint runs on pull requests only (see ci.yml) until its ignore list is
    # tuned; it must not be able to block a deploy on a cosmetic template nit.
    - name: Run quality checks
      run: |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy .
        uv run python manage.py check --settings=config.settings.test
        uv run python manage.py check --deploy --settings=config.settings.production
        uv run coverage run manage.py test --settings=config.settings.test
        uv run coverage report

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
      with:
        node-version: "20"
        cache: npm

    - name: Fail if the committed Tailwind output is stale
      run: |
        npm ci
        npm run build:css
        if ! git diff --quiet -- static/css/tailwind.css; then
          echo "::error file=static/css/tailwind.css::static/css/tailwind.css is out of date. Run 'npm run build:css' and commit the result."
          exit 1
        fi

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/homepage-web:latest
          ghcr.io/${{ github.repository_owner }}/homepage-web:${{ github.sha }}
        secrets: |
          maxmind_license_key=${{ secrets.MAXMIND_LICENSE_KEY }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/homepage-web:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/homepage-web:buildcache,mode=max
        provenance: mode=max
        sbom: true

  deploy:
    needs: build
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Upload files to server
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.prod.yml,deploy.sh,rollback.sh,nginx/"
        target: ~/homepage
        overwrite: true

    - name: Deploy to VM
      uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
        IMAGE_TAG: ${{ github.sha }}
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: ENV_FILE,IMAGE_TAG
        script: |
          cd ~/homepage
          chmod +x deploy.sh rollback.sh
          install -m 600 /dev/null .env
          printf '%s' "$ENV_FILE" > .env
          sed -i 's/\r$//' .env
          sed -i '/^$/d; /^#/d' .env
          export IMAGE_TAG="$IMAGE_TAG"
          ./deploy.sh
